name: firmware-build

on:
  push:
    branches: [main]
    tags: ['fw-v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 编译固件
    # 不用 ubuntu-latest：它正在迁到 Ubuntu 26，Python 版本会漂。
    # IDF v5.5 对 Python 3.13+ 支持没把握，22.04 + setup-python 3.11 最稳。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # IDF 的构建脚本要读 git 信息取版本号；目录属主对不上时 git 会直接拒绝
      # （dubious ownership），构建就废了。
      - name: 允许 git 读取工作区
        run: git config --global --add safe.directory '*'

      - uses: actions/setup-python@v5
        with:
          # 钉死补丁号。ESP-IDF 的 venv 在 shebang 里写死了 Python 的完整路径，
          # setup-python 给 "3.11" 会随 runner 漂到新补丁 —— 缓存里的 venv 就成了死链，
          # idf.py 找不到，退出码 127。钉死补丁号 + 缓存键带上版本，两头都堵。
          python-version: "3.11.9"

      # ESP-IDF 本体加 esp32s3 工具链约 2GB，每次从零拉要十几分钟，
      # runner 网络一慢能卡死半小时。缓存住，第二次开始省掉整段下载。
      - name: 缓存 ESP-IDF 与工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          # Python 版本进键 —— 换了版本就不能复用旧的 venv 缓存
          key: esp-idf-v5.5-esp32s3-${{ runner.os }}-py3.11.9

      # 不用 espressif/install-esp-idf-action：它没有 target 入参，
      # 装不装 esp32s3 工具链取决于它的内部推断，猜不得。
      # 官方 install.sh 显式指定目标，行为确定。
      # 不用 espressif/idf —— 那个 action 不存在（GitHub 上 404）。
      - name: 拉取并安装 ESP-IDF v5.5（esp32s3 工具链）
        run: |
          set +e
          if [ ! -d "$HOME/esp-idf/.git" ]; then
            git clone -b v5.5 --depth 1 --recursive https://github.com/espressif/esp-idf.git "$HOME/esp-idf"
          else
            echo "ESP-IDF 本体已就位（缓存命中），跳过 clone"
          fi
          # install.sh 是幂等的：工具链装过了就跳过下载，没装过的照常装。
          "$HOME/esp-idf/install.sh" esp32s3
          echo "IDF_PATH=$HOME/esp-idf" >> "$GITHUB_ENV"

      # 缓存命中不等于能用：venv 的 shebang 指向某个 Python 补丁，
      # 那个补丁不在了，export.sh 就找不到 idf.py。碰上了就重建 ——
      # 工具链压缩包在 ~/.espressif/downloads 里，重建不用重下 2GB。
      - name: 校验 ESP-IDF 环境（缓存里的 venv 可能失效）
        run: |
          set +e
          . "$HOME/esp-idf/export.sh"
          if ! command -v idf.py >/dev/null 2>&1; then
            echo "::warning::缓存里的 ESP-IDF venv 与当前 Python 不匹配（idf.py 找不到）—— 重建工具链"
            rm -rf "$HOME/.espressif/python_env"
            "$HOME/esp-idf/install.sh" esp32s3
            . "$HOME/esp-idf/export.sh"
          fi
          if ! command -v idf.py >/dev/null 2>&1; then
            echo "::error::ESP-IDF 环境修复失败，idf.py 还是找不到"
            exit 1
          fi
          idf.py --version

      - name: 编译
        run: |
          set +e
          . "$HOME/esp-idf/export.sh"
          cd firmware
          idf.py set-target esp32s3 2>&1 | tee /tmp/set-target.log
          idf.py build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          # 把错误行转成 GitHub annotation —— 日志文件下载走不通时，
          # annotation 是唯一能读到的失败原因。
          echo "--- build errors ---" >> "$GITHUB_STEP_SUMMARY"
          grep -hE 'error:|CMake Error|fatal error|FAILED|FatalError' /tmp/set-target.log /tmp/build.log \
            | head -60 | while IFS= read -r l; do
              esc=$(printf '%s' "$l" | sed 's/%/%25/g')
              echo "::error::$esc"
              echo "- $l" >> "$GITHUB_STEP_SUMMARY"
            done
          if [ "$rc" != "0" ]; then
            echo "### 最后 40 行" >> "$GITHUB_STEP_SUMMARY"
            tail -40 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      # 整片镜像（0x0 起，含 bootloader）—— 用 CMake 目标，
      # esptool 的命令行细节由 IDF 自己定，不依赖我猜参数。
      - name: 合并整片镜像
        run: |
          . "$HOME/esp-idf/export.sh"
          ninja -C firmware/build merge-bin

      # UF2：能生成就上传；生成不了不阻断（主烧录路径是 esptool 刷整片镜像）。
      - name: 生成 UF2
        run: |
          . "$HOME/esp-idf/export.sh"
          ninja -C firmware/build uf2
        continue-on-error: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bin
          path: |
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/petd.bin
            firmware/build/merged-binary.bin
            firmware/build/flash_args
            firmware/build/flasher_args.json
          if-no-files-found: error

      - name: 上传 UF2
        uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: firmware/build/uf2.bin
          if-no-files-found: ignore

  release:
    name: 发布到 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/fw-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bin
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: firmware-uf2
          path: artifacts-uf2
        continue-on-error: true
      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            artifacts-uf2/*
          generate_release_notes: true
