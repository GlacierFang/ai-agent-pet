name: python-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          # 中文字体 —— 屏上文字全靠服务端烧进 JPEG，没字体就是一片空白。
          # runner 默认不带 CJK 字体，装上才跟真机环境一致。
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # starlette.testclient 依赖 httpx；requirements.txt 是运行时依赖，不含它
          pip install pytest httpx
      - name: 跑单测
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法检查
        run: |
          python -m compileall -q petd/
      - name: 素材校验
        run: |
          python petd/tools/check_assets.py || true
      # 文档一致性 —— 代码改了而文档没跟上，比没有文档更坑。
      # 这里是真拦：命中过期的说法就红。
      - name: 文档一致性
        run: |
          python tools/check_docs.py
