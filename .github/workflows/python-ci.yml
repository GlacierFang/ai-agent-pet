name: python-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 钉在 22.04，不跟 ubuntu-latest 走。
    # ubuntu-latest 已经换成 Ubuntu 26（resolute），它的 apt 源指向
    # /etc/apt/apt-mirrors.txt，2026-11-11 起在 runner 上解析不了
    # security.ubuntu.com —— 「安装依赖」这步直接 exit 100，
    # 三个 Python 版本一起挂，而挂的其实是 apt 不是代码。
    # 固件 CI 一直用 22.04 且稳定。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          # 中文字体 —— 屏上文字全靠服务端烧进 JPEG，没字体就是一片空白。
          # runner 默认不带 CJK 字体，装上才跟真机环境一致。
          #
          # **这一步装不上不能挂整轮 CI**：单测不依赖中文字体
          # （test_backgrounds.py 的探针文字特意用 ASCII，
          #   没有 CJK 字体时 render 会把中文过滤掉，断言照样成立）——
          # 实测在一台完全没有字体的机器上，全量 504 条照样全过。
          # 所以这里只装「尽力而为」：装不上也继续往下走。
          sudo apt-get update || true
          sudo apt-get install -y fonts-noto-cjk || true
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # starlette.testclient 依赖 httpx；requirements.txt 是运行时依赖，不含它
          pip install pytest httpx
      - name: 跑单测
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法检查
        run: |
          python -m compileall -q petd/
      - name: 素材校验
        run: |
          python petd/tools/check_assets.py || true
      # 文档一致性 —— 代码改了而文档没跟上，比没有文档更坑。
      # 这里是真拦：命中过期的说法就红。
      - name: 文档一致性
        run: |
          python tools/check_docs.py
