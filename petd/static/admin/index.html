<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>petd 控制台</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="banner">
  <strong id="banner-note">petd 控制台</strong>
  <span class="banner-sub">设备画面 · 运行状态 · 在线配置</span>
  <span class="badge" id="badge-auth">—</span>
</header>

<div class="gate hidden" id="gate">
  <form id="form-gate" autocomplete="off">
    <h1>petd 控制台</h1>
    <p class="note">需要口令才能查看。</p>
    <label>口令<input type="password" id="gate-password" autocomplete="current-password"></label>
    <button type="submit">进入</button>
    <div class="muted" id="gate-meta"></div>
  </form>
</div>

<main id="app" class="hidden">

  <section class="card">
    <h2>实时预览</h2>
    <div class="preview-wrap">
      <img id="preview" src="api/preview.jpg" alt="设备当前画面">
      <div class="preview-empty" id="preview-empty">暂无帧</div>
    </div>
    <p class="note">与设备屏幕显示的是同一帧画面。</p>
    <div class="row">
      <button type="button" id="btn-preview">立即刷新</button>
      <label class="inline"><input type="checkbox" id="preview-auto" checked> 每秒自动刷新</label>
      <span class="muted" id="preview-meta"></span>
    </div>
  </section>

  <section class="card">
    <h2>设备与宠物状态</h2>
    <div class="row badges">
      <span class="badge" id="badge-gateway">gateway —</span>
      <span class="badge" id="badge-device">device —</span>
      <span class="badge" id="badge-state">state —</span>
    </div>
    <div class="kv" id="kv-status"></div>
  </section>

  <section class="card">
    <h2>诊断日志</h2>
    <div class="row">
      <label class="inline"><input type="checkbox" id="log-follow" checked> 自动滚动</label>
      <button type="button" id="btn-log-clear">清屏</button>
      <span class="muted" id="log-meta"></span>
    </div>
    <div class="log-list" id="log-list"></div>
  </section>

  <section class="card">
    <h2>在线配置</h2>
    <form id="form-config" autocomplete="off">
      <label>gateway URL<input type="text" id="cfg-gateway-url" placeholder="ws://127.0.0.1:18789"></label>
      <label>gateway token<input type="password" id="cfg-gateway-token" placeholder="***"></label>
      <label>监听端口<input type="number" id="cfg-server-port" min="1" max="65535" step="1"></label>
      <label>render quality<input type="number" id="cfg-render-quality" min="1" max="100" step="1"></label>
      <label>frame activeFps<input type="number" id="cfg-frame-active-fps" min="0" max="60" step="1"></label>
      <div class="row">
        <button type="submit">保存</button>
        <span class="muted" id="config-meta">端口改动需重启 petd 才生效；token 留空表示不改动。</span>
      </div>
    </form>
  </section>

</main>

<footer>
  <p>旋钮手势：编辑 <code>petd/data/gestures.json</code>，重启 petd 后生效。</p>
  <p id="footer-security" class="hidden">未设置访问口令，请勿把本控制台暴露到公网。</p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
